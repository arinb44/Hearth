<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Coop Builder</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="status" class="pill" data-status="connecting">Connecting…</div>
      <ul id="feed"></ul>
      <aside id="players" class="panel" hidden></aside>
      <section id="round" hidden>
        <div class="round-top">
          <span id="round-phase"></span>
          <span id="round-timer"></span>
        </div>
        <h2 id="round-title"></h2>
        <p id="round-blurb"></p>
        <ul id="round-targets"></ul>
        <div id="round-options" class="choice-list" hidden></div>
        <div id="round-votes" class="choice-list" hidden></div>
        <div id="round-lobby" hidden>
          <form id="idea-form">
            <input
              name="idea"
              placeholder="Suggest a build idea…"
              autocomplete="off"
            />
            <button type="submit">Suggest</button>
          </form>
          <button id="start-round" type="button">Start round</button>
        </div>
      </section>
      <div id="banner" hidden></div>
      <div id="results" class="overlay passive" hidden>
        <div class="confetti"></div>
        <div class="card results-card"></div>
      </div>
      <div id="toast" role="status"></div>
      <nav id="palette" hidden></nav>
      <div id="joystick" hidden><div class="knob"></div></div>
      <div id="hint">
        Click: place / rotate · Right-click: remove · R/Q: turn · 1–0: pick
      </div>
      <div id="rotate" class="overlay">
        <div class="card">
          <div class="rotate-icon">📱</div>
          <h1>Turn your phone sideways</h1>
          <p>Coop Builder plays in landscape.</p>
          <button id="go-landscape" type="button">Play in landscape</button>
        </div>
      </div>
      <div id="join" class="overlay" hidden>
        <form class="card">
          <h1>Coop Builder</h1>
          <p>Build together. Beat the clock.</p>
          <input
            name="name"
            placeholder="Your name"
            autocomplete="nickname"
            enterkeyhint="go"
          />
          <button type="submit">Join the island</button>
          <div class="join-error" role="alert"></div>
          <small>Move with WASD or the arrow keys</small>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

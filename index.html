<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Coop Builder</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="status" class="pill" data-status="connecting">Connecting…</div>
      <ul id="feed"></ul>
      <aside id="players" class="panel" hidden></aside>
      <div id="toast" role="status"></div>
      <nav id="palette" hidden></nav>
      <div id="hint">
        Click: place / rotate · Right-click: remove · R/Q: turn · 1–0: pick
      </div>
      <div id="join" class="overlay" hidden>
        <form class="card">
          <h1>Coop Builder</h1>
          <p>Build together. Beat the clock.</p>
          <input
            name="name"
            placeholder="Your name"
            autocomplete="nickname"
            enterkeyhint="go"
          />
          <button type="submit">Join the island</button>
          <div class="join-error" role="alert"></div>
          <small>Move with WASD or the arrow keys</small>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
